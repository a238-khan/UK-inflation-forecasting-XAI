data:
  train_end: '2017-12-31'
  val_end: '2021-12-31'

features:
  feature_cols:
    - cpi_yoy
    - petrol_yoy
    - bank_rate
    - fx_usd
    - gva_growth
    - unemp_rate
    - cpi_yoy_l1
    - cpi_yoy_l3
    - cpi_yoy_l6
    - petrol_yoy_l1
    - fx_usd_l1
    - bank_rate_l1
    - gva_growth_l1
    - unemp_rate_l1
  target_cols:
    - cpi_t1
    - cpi_t3
    - cpi_t5

model:
  lookback: 18
  lstm:
    hidden_size: 64
    num_layers: 1
    dropout: 0.2
    lr: 0.001
    batch_size: 16
    num_epochs: 150
    patience: 15
  xgb:
    learning_rate: 0.03
    max_depth: 6
    n_estimators: 500
    subsample: 0.9
    colsample_bytree: 0.9
    num_boost_round: 2000
    early_stopping_rounds: 75
